services:
  - type: web
    name: trend-detector
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python main.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LOG_LEVEL
        value: INFO
      - key: DASH_ENABLED
        value: "true"
      - key: DASH_HOST
        value: "0.0.0.0"
      - key: STRICT_INTEGRITY
        value: "false"
